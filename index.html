<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2340" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mob Cannon — честная игра «как в рекламе»: пушка, толпа и ворота-множители. Без рекламы и доната." />
    <title>Mob Cannon</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-left">
        <button id="btn-pause" class="icon-btn" aria-label="Пауза">❚❚</button>
        <div id="hud-level" class="pill">Уровень 1</div>
      </div>
      <div id="hud-units" class="pill dim">0</div>
      <div id="hud-coins" class="pill coin">0</div>
    </div>
    <div id="hud-timer" class="hidden"></div>
    <button id="btn-champ" class="hidden" aria-label="Чемпион"><span>👑</span></button>
    <div id="intro" class="hidden"></div>

    <div id="screen" class="hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
